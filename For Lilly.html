<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Happy Birthday Lilly 💜</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Great+Vibes&family=Parisienne&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      overflow:hidden;
      background:black;
      color:white;
    }

    /* Background */

    .background{

      position:fixed;
      inset:0;

      background:
      linear-gradient(rgba(0,0,0,0.45),rgba(0,0,0,0.65)),
      url('https://images.unsplash.com/photo-1526047932273-341f2a7631f9?q=80&w=1974&auto=format&fit=crop');

      background-size:cover;
      background-position:center;
      background-repeat:no-repeat;

      z-index:-2;

      animation:bgZoom 18s ease-in-out infinite alternate;
    }

    @keyframes bgZoom{

      from{
        transform:scale(1);
      }

      to{
        transform:scale(1.05);
      }
    }

    /* Main Container */

    .container{

      min-height:100vh;

      width:100%;

      display:none;

      justify-content:center;

      align-items:center;

      position:fixed;

      inset:0;

      padding:20px;

      overflow:auto;
    }

    /* Card */

    .card{

      width:100%;

      max-width:650px;

      padding:40px 28px;

      border-radius:30px;

      background:rgba(255,255,255,0.08);

      backdrop-filter:blur(20px);

      border:1px solid rgba(255,255,255,0.12);

      text-align:center;

      box-shadow:0 0 40px rgba(255,105,180,0.2);

      animation:fadeIn 1.5s ease;

      position:relative;

      margin:auto;
    }

    @keyframes fadeIn{

      from{
        opacity:0;
        transform:translateY(20px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    /* Intro */

    #intro{

      position:fixed;

      inset:0;

      background:rgba(0,0,0,0.88);

      display:flex;

      flex-direction:column;

      justify-content:center;

      align-items:center;

      z-index:999;

      backdrop-filter:blur(10px);

      transition:1s;
    }

    .intro-title{

      font-size:52px;

      font-family:'Great Vibes',cursive;

      color:#ffd6fa;

      text-align:center;

      margin-bottom:30px;

      padding:0 20px;

      text-shadow:0 0 25px #ff66d9;
    }

    .open-btn{

      padding:16px 38px;

      border:none;

      border-radius:999px;

      background:linear-gradient(45deg,#ff66d9,#9333ea);

      color:white;

      font-size:18px;

      cursor:pointer;

      transition:0.3s;

      box-shadow:0 0 25px rgba(255,102,217,0.8);
    }

    .open-btn:hover{

      transform:scale(1.08);
    }

    /* Title */

    .title{

      font-size:68px;

      font-family:'Great Vibes',cursive;

      color:#ffd6fa;

      margin-bottom:8px;

      text-shadow:0 0 18px rgba(255,182,255,0.8);
    }

    /* Stylish Name */

    .name{

      font-size:64px;

      font-family:'Parisienne',cursive;

      font-weight:400;

      color:#ffffff;

      margin-bottom:25px;

      letter-spacing:2px;

      text-shadow:
      0 0 12px rgba(255,255,255,0.7),
      0 0 25px rgba(192,132,252,0.8);

      animation:nameGlow 3s infinite alternate;
    }

    @keyframes nameGlow{

      from{
        transform:scale(1);
        text-shadow:
        0 0 10px rgba(255,255,255,0.5),
        0 0 20px rgba(192,132,252,0.6);
      }

      to{
        transform:scale(1.03);
        text-shadow:
        0 0 18px rgba(255,255,255,0.9),
        0 0 35px rgba(192,132,252,1);
      }
    }

    /* Message */

    .message{

      font-size:18px;

      line-height:1.9;

      color:#fff0fb;

      margin-bottom:30px;

      white-space:pre-line;
    }

    /* Button */

    .secret-btn{

      padding:15px 35px;

      border:none;

      border-radius:999px;

      background:linear-gradient(45deg,#ff66d9,#9333ea);

      color:white;

      font-size:18px;

      cursor:pointer;

      transition:0.3s;

      box-shadow:0 0 20px rgba(255,105,180,0.45);
    }

    .secret-btn:hover{

      transform:scale(1.06);
    }

    /* Secret Message */

    .secret{

      display:none;

      margin-top:28px;

      font-size:26px;

      color:#ffd6fa;

      font-family:'Great Vibes',cursive;
    }

    /* Footer */

    .footer{

      margin-top:35px;

      font-size:15px;

      color:#e9d5ff;

      opacity:0.85;
    }

    /* Floating Flowers */

    .petal{

      position:fixed;

      top:-50px;

      color:#ffb7e8;

      animation:fall linear infinite;

      pointer-events:none;

      z-index:-1;
    }

    @keyframes fall{

      0%{
        transform:translateY(-10vh) rotate(0deg);
        opacity:0;
      }

      10%{
        opacity:1;
      }

      100%{
        transform:translateY(110vh) rotate(360deg);
        opacity:0;
      }
    }

    /* Mobile */

    @media(max-width:768px){

      .title{
        font-size:50px;
      }

      .name{
        font-size:46px;
      }

      .message{
        font-size:15px;
        line-height:1.8;
      }

      .card{
        padding:28px 18px;
      }

      .intro-title{
        font-size:38px;
      }

      .secret{
        font-size:22px;
      }

    }

  </style>

</head>

<body>

<!-- Background -->

<div class="background"></div>

<!-- Intro -->

<div id="intro">

  <div class="intro-title">
    For Lilly 💜 <br>
    From Kooky 🎀
  </div>

  <button class="open-btn" onclick="openGift()">
    Tap To Enter ✨
  </button>

</div>

<!-- Main -->

<div class="container" id="main">

  <div class="card">

    <div class="title">
      Happy Birthday
    </div>

    <div class="name">
      Lilly 💜
    </div>

    <div class="message" id="typedText"></div>

    <button class="secret-btn" onclick="showSecret()">
      Click For A Little Magic ✨
    </button>

    <div class="secret" id="secretText">
      Thank you for becoming the most special person in my life 💖
    </div>

    <div class="footer">
      — From someone really lucky to have you 💙
    </div>

  </div>

</div>

<script>

  // OPEN PAGE

  function openGift(){

    document.getElementById("intro").style.opacity = "0";

    setTimeout(()=>{

      document.getElementById("intro").style.display = "none";

      document.getElementById("main").style.display = "flex";

      typeText();

    },800);

  }

  // TYPEWRITER TEXT

  const text =
`We started as strangers with a family connection.

And then one random day, I texted you.

Sometimes I think about what if I never sent that one message,
maybe we would've still stayed strangers who only knew each other by name.

But now?
In such short time you became closest person in my life. 🌸

Now somehow,
you became my favorite person,
the person I think about randomly during the day,
and the person who makes ordinary days feel special.

And honestly,
I don't think you realize how special you are to me.

And this is only the beginning.
We still have so many memories to make,
so many goals to achieve. ✨

No matter where life takes us,
I hope we always stay this close.`;

  let i = 0;

  function typeText(){

    if(i < text.length){

      document.getElementById("typedText").innerHTML += text.charAt(i);

      i++;

      setTimeout(typeText,28);

    }

  }

  // SECRET MESSAGE

  function showSecret(){

    document.getElementById("secretText").style.display = "block";

  }

  // FLOWERS

  for(let i=0;i<35;i++){

    const petal = document.createElement("div");

    petal.classList.add("petal");

    petal.innerHTML = "🌸";

    petal.style.left = Math.random()*100 + "vw";

    petal.style.animationDuration = (Math.random()*8+5)+"s";

    petal.style.fontSize = (Math.random()*18+15)+"px";

    document.body.appendChild(petal);

  }

</script>

</body>
</html>
